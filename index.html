<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jose Landscaping Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .view { display: none; }
        .view.active { display: block; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-gray-100">

    <div class="flex min-h-screen">
        <aside class="w-64 bg-green-900 text-white p-6 no-print fixed h-full">
            <img src="logo.png" class="w-24 h-24 mx-auto mb-4 rounded-full bg-white object-contain">
            <h1 class="text-center font-bold mb-8 uppercase text-sm">Jose Landscaping Care</h1>
            <nav class="space-y-2">
                <button onclick="irA('v-factura')" class="w-full text-left p-3 hover:bg-green-700 rounded">📄 Nueva Factura</button>
                <button onclick="irA('v-clientes')" class="w-full text-left p-3 hover:bg-green-700 rounded">👥 Clientes</button>
                <button onclick="irA('v-historial')" class="w-full text-left p-3 hover:bg-green-700 rounded">📊 Historial</button>
            </nav>
        </aside>

        <main class="flex-1 ml-64 p-10">
            
            <div id="v-factura" class="view active">
                <div id="area-impresion" class="bg-white p-10 shadow-lg max-w-[800px] mx-auto border-t-8 border-green-600">
                    <div class="flex justify-between items-start mb-8">
                        <div>
                            <img src="logo.png" class="w-20 h-20 mb-2">
                            <h2 class="text-2xl font-bold text-green-800">JOSE LANDSCAPING CARE</h2>
                            <p class="text-xs text-gray-500 uppercase">Cuidado Profesional de Jardines</p>
                        </div>
                        <div class="text-right">
                            <h2 class="text-4xl font-black text-gray-200">INVOICE</h2>
                            <input type="text" id="folio" class="text-right border-b outline-none font-bold text-green-700" placeholder="Folio">
                            <br><input type="date" id="fecha" class="text-right border-b outline-none text-sm mt-2">
                        </div>
                    </div>

                    <div class="bg-gray-50 p-4 rounded mb-6 flex justify-between">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Cliente:</p>
                            <select id="sel-cliente" class="no-print border p-1 rounded text-sm mb-2" onchange="seleccionarCliente()"></select>
                            <p id="doc-nombre" class="font-bold text-lg">- Seleccione Cliente -</p>
                            <p id="doc-dir" class="text-sm text-gray-500 uppercase">Dirección de servicio</p>
                        </div>
                        <div class="text-right">
                            <label class="text-xs font-bold text-green-600 uppercase">
                                <input type="checkbox" id="pagado"> ¿Ya está pagado?
                            </label>
                        </div>
                    </div>

                    <table class="w-full mb-6">
                        <thead><tr class="bg-green-800 text-white text-xs uppercase">
                            <th class="p-2 text-left">Descripción</th>
                            <th class="p-2 w-20 text-center">Cant.</th>
                            <th class="p-2 w-32 text-right">Precio</th>
                            <th class="p-2 w-32 text-right">Total</th>
                        </tr></thead>
                        <tbody id="filas" class="border"></tbody>
                    </table>

                    <div class="text-right">
                        <p class="text-xs text-gray-500">Subtotal: <span id="sub">$0.00</span></p>
                        <p class="text-2xl font-bold text-green-700">TOTAL: <span id="tot">$0.00</span></p>
                    </div>
                </div>
                <div class="max-w-[800px] mx-auto mt-6 flex gap-4 no-print">
                    <button onclick="nuevaFila()" class="bg-white border border-green-800 px-4 py-2 rounded font-bold text-xs uppercase">＋ Añadir Concepto</button>
                    <button onclick="guardar()" class="bg-green-700 text-white px-6 py-2 rounded font-bold flex-1 uppercase text-xs">Guardar y Descargar PDF</button>
                </div>
            </div>

            <div id="v-clientes" class="view">
                <div class="bg-white p-8 rounded shadow max-w-2xl">
                    <h2 class="text-xl font-bold mb-4 uppercase">Registrar Nuevo Cliente</h2>
                    <div class="grid grid-cols-1 gap-4">
                        <input type="text" id="n-cli" placeholder="Nombre completo" class="p-3 border rounded">
                        <input type="text" id="d-cli" placeholder="Dirección" class="p-3 border rounded">
                        <button onclick="crearCliente()" class="bg-green-800 text-white p-3 rounded font-bold uppercase">Guardar en Agenda</button>
                    </div>
                    <div id="lista-cli" class="mt-8 space-y-2"></div>
                </div>
            </div>

            <div id="v-historial" class="view">
                <h2 class="text-xl font-bold mb-4 uppercase">Historial de Ventas</h2>
                <div class="bg-white rounded shadow overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100 uppercase text-xs font-bold">
                            <tr><th class="p-4">Folio</th><th class="p-4">Cliente</th><th class="p-4 text-right">Monto</th><th class="p-4">Estado</th></tr>
                        </thead>
                        <tbody id="tabla-h" class="divide-y"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script>
        // Datos iniciales
        let clientes = JSON.parse(localStorage.getItem('jlc_clientes')) || [];
        let facturas = JSON.parse(localStorage.getItem('jlc_facturas')) || [];

        // Función para cambiar de vista
        function irA(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'v-clientes') listarClientes();
            if(id === 'v-historial') listarHistorial();
            actualizarSelect();
        }

        // Clientes
        function crearCliente() {
            const nom = document.getElementById('n-cli').value;
            const dir = document.getElementById('d-cli').value;
            if(!nom) return alert("El nombre es obligatorio");
            
            clientes.push({ nombre: nom, direccion: dir });
            localStorage.setItem('jlc_clientes', JSON.stringify(clientes));
            
            document.getElementById('n-cli').value = "";
            document.getElementById('d-cli').value = "";
            alert("Cliente guardado con éxito");
            listarClientes();
            actualizarSelect();
        }

        function listarClientes() {
            document.getElementById('lista-cli').innerHTML = clientes.map(c => `
                <div class="p-3 bg-gray-50 border-l-4 border-green-600 font-bold uppercase text-xs flex justify-between">
                    <span>${c.nombre}</span> <span class="text-gray-400 italic">${c.direccion}</span>
                </div>`).join('');
        }

        function actualizarSelect() {
            const sel = document.getElementById('sel-cliente');
            if(!sel) return;
            sel.innerHTML = '<option value="">-- Seleccionar --</option>' + 
                clientes.map((c, i) => `<option value="${i}">${c.nombre}</option>`).join('');
        }

        function seleccionarCliente() {
            const i = document.getElementById('sel-cliente').value;
            if(i === "") return;
            document.getElementById('doc-nombre').innerText = clientes[i].nombre;
            document.getElementById('doc-dir').innerText = clientes[i].direccion;
        }

        // Factura
        function nuevaFila() {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="p-2"><input type="text" class="w-full outline-none font-bold text-gray-700" placeholder="Servicio..."></td>
                <td class="p-2"><input type="number" value="1" class="w-full text-center outline-none" oninput="calc()"></td>
                <td class="p-2"><input type="number" value="0" class="w-full text-right outline-none" oninput="calc()"></td>
                <td class="p-2 text-right font-bold">$0.00</td>
            `;
            document.getElementById('filas').appendChild(tr);
        }

        function calc() {
            let sub = 0;
            document.querySelectorAll('#filas tr').forEach(r => {
                const c = r.cells.children.value;
                const p = r.cells.children.value;
                const t = c * p;
                r.cells.innerText = "$" + t.toFixed(2);
                sub += t;
            });
            document.getElementById('sub').innerText = "$" + sub.toFixed(2);
            document.getElementById('tot').innerText = "$" + (sub * 1.16).toFixed(2);
        }

        function guardar() {
            const tot = document.getElementById('tot').innerText;
            if(tot === "$0.00") return alert("Añada un servicio primero");

            const f = {
                folio: document.getElementById('folio').value || "JLC-00",
                cliente: document.getElementById('doc-nombre').innerText,
                total: tot,
                pagada: document.getElementById('pagado').checked
            };

            facturas.push(f);
            localStorage.setItem('jlc_facturas', JSON.stringify(facturas));

            // Descargar PDF
            const element = document.getElementById('area-impresion');
            html2pdf().from(element).set({
                margin: 10,
                filename: f.folio + '.pdf',
                html2canvas: { scale: 2 }
            }).save();

            alert("Factura guardada y PDF generado");
            irA('v-historial');
        }

        function listarHistorial() {
            document.getElementById('tabla-h').innerHTML = facturas.slice().reverse().map(f => `
                <tr class="hover:bg-gray-50">
                    <td class="p-4 font-bold uppercase">${f.folio}</td>
                    <td class="p-4 uppercase">${f.cliente}</td>
                    <td class="p-4 text-right font-bold text-green-700">${f.total}</td>
                    <td class="p-4">
                        <span class="text-[10px] font-bold p-1 rounded ${f.pagada ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} uppercase">
                            ${f.pagada ? 'Pagado' : 'Pendiente'}
                        </span>
                    </td>
                </tr>`).join('');
        }

        // Iniciar página
        document.getElementById('fecha').valueAsDate = new Date();
        nuevaFila();
        actualizarSelect();
    </script>
</body>
</html>
