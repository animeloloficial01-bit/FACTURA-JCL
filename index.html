<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jose Landscaping Care - Sistema de Facturación</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.6.14/vue.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        [v-cloak] { display: none !important; }
        
        /* Oculto en pantalla, pero disponible para la impresión */
        #print-area { display: none; }
        
        @media print {
            .no-print { display: none !important; }
            #print-area { display: block !important; padding: 20px; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="app" v-cloak>
        <main class="p-8">
            <h1 class="text-2xl font-black mb-6">Terminal de Facturación</h1>
            
            <div class="bg-white p-6 rounded-xl shadow border">
                <button @click="generarPDF" class="bg-slate-900 text-white px-6 py-3 rounded-lg font-bold hover:bg-slate-800">
                    🖨️ Descargar/Imprimir PDF
                </button>
            </div>
        </main>

        <div id="print-area">
            <h1 style="text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 10px;">JOSE LANDSCAPING CARE</h1>
            <p style="text-align: center; margin-bottom: 20px;">Servicio Profesional de Jardinería</p>
            
            <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                <tr>
                    <td style="border: 1px solid #333; padding: 10px;"><strong>Folio:</strong> #{{ invoice.folio }}</td>
                    <td style="border: 1px solid #333; padding: 10px;"><strong>Fecha:</strong> {{ new Date().toLocaleDateString() }}</td>
                </tr>
            </table>

            <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                <thead>
                    <tr style="background-color: #eee;">
                        <th style="border: 1px solid #333; padding: 10px;">Descripción</th>
                        <th style="border: 1px solid #333; padding: 10px;">Cant</th>
                        <th style="border: 1px solid #333; padding: 10px;">Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="item in invoice.items" :key="item.description">
                        <td style="border: 1px solid #333; padding: 10px;">{{ item.description }}</td>
                        <td style="border: 1px solid #333; padding: 10px; text-align: center;">{{ item.qty }}</td>
                        <td style="border: 1px solid #333; padding: 10px; text-align: right;">${{ (item.qty * item.price).toFixed(2) }}</td>
                    </tr>
                </tbody>
            </table>
            
            <p style="text-align: right; font-size: 20px; font-weight: bold; margin-top: 20px;">
                TOTAL: ${{ totalCalculado.total }}
            </p>
        </div>
    </div>

<script>
    new Vue({
        el: '#app',
        data: {
            invoice: { folio: '001', items: [{ description: 'Servicio Base', qty: 1, price: 50 }] }
        },
        computed: {
            totalCalculado() {
                let total = this.invoice.items.reduce((sum, item) => sum + (item.qty * item.price), 0);
                return { total: total.toFixed(2) };
            }
        },
        methods: {
            generarPDF() {
                // Obtenemos el HTML del contenedor de impresión
                const printContent = document.getElementById('print-area').innerHTML;
                
                // Abrimos una ventana emergente limpia
                const win = window.open('', '_blank', 'width=800,height=600');
                
                // Escribimos el documento con estilos básicos en línea para asegurar renderizado
                win.document.write(`
                    <html>
                        <head>
                            <title>Factura ${this.invoice.folio}</title>
                            <style>
                                body { font-family: Arial, sans-serif; padding: 40px; }
                                table { width: 100%; border-collapse: collapse; }
                                th, td { border: 1px solid #000; padding: 10px; text-align: left; }
                            </style>
                        </head>
                        <body>
                            ${printContent}
                        </body>
                    </html>
                `);
                
                win.document.close();
                
                // Forzamos el diálogo de impresión
                setTimeout(() => {
                    win.print();
                    win.close();
                }, 500);
            }
        }
    });
</script>
</body>
</html>
