<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jose Landscaping Care - Enterprise Management System</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.6.14/vue.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        [v-cloak] { display: none !important; }
        
        /* Contenedor oculto para impresión */
        .pdf-hidden-container {
            display: none;
        }

        @media print {
            .no-print { display: none !important; }
            .pdf-hidden-container { display: block !important; padding: 20px; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="app" v-cloak>
        <button @click="descargarPDFDirecto" class="w-full bg-slate-950 text-white font-bold py-2 rounded-xl text-[11px] uppercase tracking-wider">
            📥 Guardar PDF (Impresión Nativa)
        </button>

        <div id="print-area" class="pdf-hidden-container">
            <h1 style="text-align: center; font-size: 24px; font-weight: bold;">JOSE LANDSCAPING CARE</h1>
            <p style="text-align: center;">Servicio Profesional de Jardinería</p>
            <hr>
            <div style="margin: 20px 0;">
                <p><strong>Factura:</strong> #{{ invoice.folio || 'S/N' }}</p>
                <p><strong>Fecha:</strong> {{ new Date().toLocaleDateString() }}</p>
            </div>
            <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                <thead>
                    <tr style="background: #f3f4f6;">
                        <th style="border: 1px solid #ccc; padding: 8px;">Descripción</th>
                        <th style="border: 1px solid #ccc; padding: 8px;">Cant</th>
                        <th style="border: 1px solid #ccc; padding: 8px;">Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="item in invoice.items" :key="item.description">
                        <td style="border: 1px solid #ccc; padding: 8px;">{{ item.description }}</td>
                        <td style="border: 1px solid #ccc; padding: 8px; text-align: center;">{{ item.qty }}</td>
                        <td style="border: 1px solid #ccc; padding: 8px; text-align: right;">${{ (item.qty * item.price).toFixed(2) }}</td>
                    </tr>
                </tbody>
            </table>
            <div style="margin-top: 20px; text-align: right; font-size: 18px; font-weight: bold;">
                Total: ${{ totalCalculado.total }}
            </div>
        </div>
    </div>

<script>
    // ... (Tu configuración de Firebase igual)

    new Vue({
        el: '#app',
        // ... (Tu data y computed igual)
        methods: {
            // NUEVO MÉTODO ROBUSTO
            descargarPDFDirecto() {
                const printContent = document.getElementById('print-area').innerHTML;
                const win = window.open('', '_blank', 'width=800,height=600');
                
                win.document.write(`
                    <html>
                        <head>
                            <title>Factura ${this.invoice.folio || ''}</title>
                            <style>
                                body { font-family: sans-serif; padding: 40px; }
                                table { width: 100%; border-collapse: collapse; }
                                th, td { border: 1px solid #ccc; padding: 10px; }
                            </style>
                        </head>
                        <body>
                            ${printContent}
                        </body>
                    </html>
                `);
                
                win.document.close();
                
                // Pequeña espera para asegurar que el navegador cargue el HTML antes de abrir el diálogo
                setTimeout(() => {
                    win.print();
                    win.close();
                }, 500);
            },
            // ... (Resto de tus métodos)
        }
    });
</script>
</body>
</html>
